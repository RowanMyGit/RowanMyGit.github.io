<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Box Model Practice</title>
        <script src="../validate.js"></script>
        <style>
            #redbox{
                background-color:red;
                height:50px;
                width:50px;
                border:2px black solid;
                padding:0px;
                background-clip:content-box;
                margin-left:200px;
            }
            #bluebox{
                background-color:steelblue;
                height:50px;
                width:50px;
                border:2px black solid;
                padding:50px;
                background-clip:content-box;
                margin-left:253px;
            }
            #greenbox{
                background-color:green;
                height:50px;
                width:50px;
                border:2px black solid;
                padding-left:10px;
                background-clip:content-box;
                margin-left:2px;
            }
            #yellowbox{
                background-color:lemonchiffon;
                height:50px;
                width:50px;
                border:2px black solid;
                padding-top:20px;
                padding-left:10px;
                padding-right:10px;
                
                background-clip:content-box;
                margin-left:200px;
            }
            #purpurbox{
                background-color:rebeccapurple;
                height:50px;
                width:50px;
                border:2px black solid;
                padding-bottom:50px;
                background-clip:content-box;
                margin-left:150px;
            }
        </style>
    </head>
    <body>
        <h1>Look at dem boxes</h1>
        <div id="redbox"></div>
        <div id="bluebox"></div>
        <div id="greenbox"></div>
        <div id="yellowbox"></div>
        <div id="purpurbox"></div>
     </body>


</html>
