<html lang="en">
    <head>    <style>
            body{
                background-color: whitesmoke;
                height: 100vh;
            }
            h1{
                text-align: center;
                font-family: sans-serif, Fantasy;
                color: rgb(105, 58, 12);
            }
            .container {
              display: grid;
              width: 80vw;
              height: 80vh;
              margin: auto;
              grid-template-columns: 1fr 1fr 1fr;
              grid-template-rows: 1fr 1fr 1fr;
              background: radial-gradient(rgb(0, 247, 255),rgb(253, 253, 72));
              padding: 10px;
              border-radius: 40px;
              border: 16px solid rgb(181, 177, 177);
            }
            .heart {
              height: 20vh; /* adjust to control the size */
              aspect-ratio: 1;
              --_m: radial-gradient(#000 69%,#0000 70%) 84.5%/50%;
              -webkit-mask-box-image: var(--_m);
                         mask-border: var(--_m);
              clip-path: polygon(-41% 0,50% 91%, 141% 0);
              background-color: rgb(128, 60, 12);
              margin: auto;
            }
            /* fallback until better support for mask-border */
            @supports not (-webkit-mask-box-image: var(--_m)) { 
              .heart {
                mask:
                 radial-gradient(at 70% 31%,#000 29%,#0000 30%),
                 radial-gradient(at 30% 31%,#000 29%,#0000 30%),
                 conic-gradient(#000 0 0) bottom/100% 50% no-repeat;
              }
            }
            #chocolateheart{
                grid-column-start: 3;
                grid-row-start:2;
            }
            #bar{
                grid-column-start: 1;
                grid-row-start: 2;
                width:30vh;
                height:20vh;
                background-color: brown;
                border-width: 5px;
                border-color: rgb(71, 50, 14);
            }
            .lilbits{
                grid-column-start: 1;
                grid-row-start: 1;
                display: grid;
              grid-template-columns: 1fr 1fr 1fr;
              grid-template-rows: 1fr 1fr 1fr;
            }
            #mnm{
                grid-column-start:1;
                grid-row-start:1;
                width:10vh;
                height:10vh;
                background-color:red;
                border-radius:50%;
                margin: auto;
                display: grid;
                place-items: center;
                font-size: 2em;
            }
            
            #mnm2{
                grid-column-start:2;
                grid-row-start:1;
                width:10vh;
                height:10vh;
                background-color:rgb(62, 215, 11);
                border-radius:50%;
                margin: auto;
                display: grid;
                place-items: center;
                font-size: 2em;
            }
        </style>
        <title>Box of chocolates</title>
    </head>
    <body>
        <h1>Hey Chris, I got you some... chocolates!? &lt;3</h1>
        <div class="container">
            <div id="bar"></div>
            <div class="heart" id="chocolateheart"></div>
            <div class="lilbits">
                <div id="mnm">
                m
                </div>
                <div id="mnm2">
                    m
                </div>
                <!-- TODO: Add some more divs here, and style them
                    to fill in the 'lilbits' part of the chocolate box -->
            </div>
            <!-- TODO: Add some more divs here, and style them
                to fill in the other sections of the chocolate box -->
        </div>
    </body>
</html>
